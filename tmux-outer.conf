# Outer tmux config for agent-monitor
# Uses C-\ prefix to avoid conflicts with both inner tmux (C-b) and Emacs (C-a)

# Different prefix
set -g prefix 'C-\'
unbind C-b
bind 'C-\' send-prefix

# Different socket (completely separate from regular tmux)
# Started via: tmux -L agent-monitor -f tmux-outer.conf

# Visual distinction
set -g status-style "bg=#1a0033,fg=#cc66ff"
set -g status-left "#[fg=#cc66ff,bold] agent-monitor #[fg=#6677aa]│ "
set -g status-right "#(~/.local/bin/agent-monitor-stats) #[fg=#6677aa]│ #[fg=#9933ff]#H #[fg=#6677aa]│ #[fg=#b84dff]%H:%M "
set -g status-left-length 30
set -g status-right-length 90

# Pane borders - purple theme to distinguish from inner tmux
set -g pane-border-style "fg=#4a0080"
set -g pane-active-border-style "fg=#9933ff"

# No escape delay (important for nested tmux)
set -sg escape-time 0

# Mouse support for resizing panes
set -g mouse on

# Clipboard: allow OSC52 escape sequences to pass through to outer terminal.
# This enables copy/paste from inner tmux sessions attached in the right pane.
set -g allow-passthrough on
set -g set-clipboard on

# Don't rename windows automatically
set -g allow-rename off

# Start with a sensible layout
# Left pane: agent-monitor (narrow)
# Right pane: attached agent session (wide)

# Key bindings
# C-\ h - focus left pane (agent-monitor)
# C-\ l - focus right pane (agent view)
# C-\ q - quit agent-monitor session
bind h select-pane -L
bind l select-pane -R
bind q confirm-before -p "Quit agent-monitor? (y/n)" kill-session

# Resize panes
bind -r H resize-pane -L 5
bind -r L resize-pane -R 5

# No other bindings needed - keep it minimal
