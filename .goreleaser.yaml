version: 2

builds:
  - id: agent-monitor
    main: ./cmd/agent-monitor
    binary: agent-monitor
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: darwin
        goarch: amd64

archives:
  - id: agent-monitor
    formats: [tar.gz]
    name_template: "agent-monitor_{{ .Os }}_{{ .Arch }}"
    files:
      - agent-monitor-session
      - focus-agent-monitor
      - agent-monitor-placeholder

checksum:
  name_template: "checksums.txt"

release:
  # GitHub releases retired 2026-10-20: binaries are release assets on
  # code.middlefork.org, and the tap is smithy/homebrew-tap there.
  # Cut a release from a workstation (sprinkle-runner has no secrets):
  #   git tag -a vX.Y.Z -m ... && git push code-public vX.Y.Z
  #   MIDDLEFORK_TOKEN=$(ho secret get code-public/release-token) \
  #   TAP_SSH_KEY=~/.ssh/id_ed25519 goreleaser release --clean
  disable: true

publishers:
  - name: middlefork
    checksum: true
    cmd: >-
      curl -fsS -T "{{ .ArtifactPath }}"
      -H "Authorization: token {{ .Env.MIDDLEFORK_TOKEN }}"
      "https://code.middlefork.org/api/v1/repos/smithy/agent-monitor/releases/{{ .Tag }}/assets/{{ .ArtifactName }}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

brews:
  - name: agent-monitor
    repository:
      owner: smithy
      name: homebrew-tap
      branch: main
      git:
        url: "ssh://code.bcc.sh:23232/smithy/homebrew-tap.git"
        private_key: "{{ .Env.TAP_SSH_KEY }}"
    url_template: "https://code.middlefork.org/api/v1/repos/smithy/agent-monitor/releases/{{ .Tag }}/assets/{{ .ArtifactName }}"
    directory: Formula
    homepage: "https://code.middlefork.org/smithy/agent-monitor"
    description: "TUI for tracking Claude Code agents in tmux sessions"
    license: "GPL-3.0"
    install: |
      bin.install "agent-monitor"
      bin.install "agent-monitor-session"
      bin.install "focus-agent-monitor"
      bin.install "agent-monitor-placeholder"
    caveats: |
      Run `agent-monitor` in a terminal to open the outer tmux layout. Its
      tmux config is built in and is written to
      ~/.config/agent-monitor-tmux.conf on first run; edit it there.
    test: |
      assert_match "agent-monitor", shell_output("#{bin}/agent-monitor --help 2>&1")
