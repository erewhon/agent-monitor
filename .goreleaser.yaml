version: 2

builds:
  - id: agent-monitor
    main: ./cmd/agent-monitor
    binary: agent-monitor
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: darwin
        goarch: amd64

archives:
  - id: agent-monitor
    formats: [tar.gz]
    name_template: "agent-monitor_{{ .Os }}_{{ .Arch }}"
    files:
      - agent-monitor-session
      - focus-agent-monitor
      - agent-monitor-placeholder

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

brews:
  - name: agent-monitor
    repository:
      owner: erewhon
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/erewhon/agent-monitor"
    description: "TUI for tracking Claude Code agents in tmux sessions"
    license: "GPL-3.0"
    install: |
      bin.install "agent-monitor"
      bin.install "agent-monitor-session"
      bin.install "focus-agent-monitor"
      bin.install "agent-monitor-placeholder"
    caveats: |
      Run `agent-monitor` in a terminal to open the outer tmux layout. Its
      tmux config is built in and is written to
      ~/.config/agent-monitor-tmux.conf on first run; edit it there.
    test: |
      assert_match "agent-monitor", shell_output("#{bin}/agent-monitor --help 2>&1")
