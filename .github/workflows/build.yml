name: Build

# Build check only. Releases are cut locally with goreleaser and published to
# code.middlefork.org (see the header of .goreleaser.yaml); the GoReleaser step
# that used to run here on tags and GitHub releases was removed 2026-10-20.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -o agent-monitor ./cmd/agent-monitor
