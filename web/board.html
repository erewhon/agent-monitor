<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Monitor — Kanban</title>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <style>
    :root {
      --bg: #0d0015;
      --surface: #1a0033;
      --surface2: #2a004d;
      --border: #4a0080;
      --border-bright: #9933ff;
      --text: #e0d0f0;
      --text-dim: #8a7a9a;
      --accent: #cc66ff;
      --accent-bright: #e0b3ff;

      --status-running: #66ff66;
      --status-planning: #b388ff;
      --status-waiting: #ffcc00;
      --status-idle: #888;
      --status-recent-idle: #66ccaa;
      --status-error: #ff4444;

      --col-backlog: #4a0080;
      --col-active: #006633;
      --col-needs-input: #665500;
      --col-done: #333366;
      --col-archived: #333;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'SF Mono', 'Cascadia Code', 'JetBrains Mono', monospace;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    header h1 {
      font-size: 16px;
      font-weight: 600;
      background: linear-gradient(90deg, #9933ff, #cc66ff, #e0b3ff, #cc66ff, #9933ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    header .meta {
      font-size: 11px;
      color: var(--text-dim);
    }

    .toolbar {
      display: flex;
      gap: 8px;
      padding: 8px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      align-items: center;
    }

    .toolbar select, .toolbar input, .toolbar button {
      font-family: inherit;
      font-size: 12px;
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 4px 8px;
    }

    .toolbar button {
      cursor: pointer;
      background: var(--border);
      border-color: var(--border-bright);
    }

    .toolbar button:hover {
      background: var(--border-bright);
      color: #fff;
    }

    .main-layout {
      display: flex;
      gap: 0;
      min-height: calc(100vh - 100px);
    }

    .board {
      flex: 1;
      padding: 12px 20px;
      overflow-y: auto;
    }

    .board-header {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 8px;
      position: sticky;
      top: 0;
      z-index: 2;
      background: var(--bg);
      padding-bottom: 4px;
    }

    .board-header-col {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-dim);
      padding: 6px 8px;
      text-align: center;
    }

    .board-header-col[data-column="backlog"] { border-top: 3px solid var(--col-backlog); }
    .board-header-col[data-column="active"] { border-top: 3px solid var(--col-active); }
    .board-header-col[data-column="needs_input"] { border-top: 3px solid var(--col-needs-input); }
    .board-header-col[data-column="done"] { border-top: 3px solid var(--col-done); }

    .swim-lane {
      margin-bottom: 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
    }

    .swim-lane-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      cursor: pointer;
      user-select: none;
      font-size: 12px;
      font-weight: 600;
      border-bottom: 1px solid transparent;
    }

    .swim-lane:not(.collapsed) .swim-lane-header {
      border-bottom-color: var(--border);
    }

    .swim-lane-header:hover {
      background: var(--surface2);
      border-radius: 6px;
    }

    .collapse-icon {
      font-size: 10px;
      color: var(--text-dim);
      transition: transform 0.15s;
      width: 12px;
      text-align: center;
    }

    .swim-lane.collapsed .collapse-icon {
      transform: rotate(-90deg);
    }

    .swim-lane-name {
      color: var(--accent);
      flex: 1;
    }

    .swim-lane-count {
      background: var(--surface2);
      border-radius: 10px;
      padding: 1px 7px;
      font-size: 11px;
      color: var(--text-dim);
    }

    .swim-lane-body {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      padding: 6px;
    }

    .swim-lane.collapsed .swim-lane-body {
      display: none;
    }

    .swim-col {
      min-height: 20px;
    }

    .agents-panel {
      width: 240px;
      min-width: 240px;
      background: var(--surface);
      border-left: 1px solid var(--border);
      padding: 0;
      overflow-y: auto;
    }

    .agents-panel-header {
      padding: 10px 12px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      background: var(--surface);
      z-index: 1;
    }

    .agents-list {
      padding: 6px;
    }

    .agent-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 8px;
      border-radius: 4px;
      font-size: 12px;
      transition: background 0.1s;
    }

    .agent-item:hover {
      background: var(--surface2);
    }

    .agent-name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .agent-activity {
      font-size: 10px;
      color: var(--text-dim);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding: 0 8px 4px 28px;
      margin-top: -2px;
    }

    .agent-group-header {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--accent);
      padding: 8px 8px 4px;
      margin-top: 4px;
    }

    .agent-group-header:first-child {
      margin-top: 0;
    }

    .column-count {
      background: var(--surface2);
      border-radius: 10px;
      padding: 1px 7px;
      font-size: 11px;
      color: var(--text-dim);
    }

    .cards {
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-height: 40px;
    }

    .card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      cursor: default;
      transition: border-color 0.15s;
    }

    .card:hover {
      border-color: var(--border-bright);
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
    }

    .card-title {
      font-size: 13px;
      font-weight: 500;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .badge {
      font-size: 10px;
      font-weight: 700;
      padding: 1px 4px;
      border-radius: 3px;
      letter-spacing: 0.3px;
    }

    .badge-cc { color: #b388ff; border: 1px solid #b388ff33; }
    .badge-oc { color: #4fc3f7; border: 1px solid #4fc3f733; }
    .badge-cr { color: #ef5350; border: 1px solid #ef535033; }
    .badge-cx { color: #66bb6a; border: 1px solid #66bb6a33; }
    .badge-unknown { color: var(--text-dim); border: 1px solid #88888833; }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .status-running { background: var(--status-running); box-shadow: 0 0 4px var(--status-running); }
    .status-planning { background: var(--status-planning); }
    .status-waiting { background: var(--status-waiting); box-shadow: 0 0 4px var(--status-waiting); }
    .status-idle { background: var(--status-idle); }
    .status-error { background: var(--status-error); }
    .status-unknown { background: var(--status-idle); }

    .card-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: var(--text-dim);
    }

    .card-session {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .card-actions {
      display: none;
      gap: 4px;
      margin-top: 6px;
    }

    .card:hover .card-actions {
      display: flex;
    }

    .card-actions button {
      font-family: inherit;
      font-size: 10px;
      background: var(--surface);
      color: var(--text-dim);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 2px 6px;
      cursor: pointer;
    }

    .card-actions button:hover {
      background: var(--border);
      color: var(--text);
    }

    .card-description {
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 4px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-activity {
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 3px;
      font-style: italic;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Create task modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.active { display: flex; }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border-bright);
      border-radius: 8px;
      padding: 20px;
      width: 400px;
      max-width: 90vw;
    }

    .modal h2 {
      font-size: 14px;
      margin-bottom: 12px;
      color: var(--accent);
    }

    .modal label {
      display: block;
      font-size: 11px;
      color: var(--text-dim);
      margin-bottom: 4px;
      margin-top: 10px;
    }

    .modal input, .modal textarea, .modal select {
      width: 100%;
      font-family: inherit;
      font-size: 13px;
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 6px 8px;
    }

    .modal textarea { resize: vertical; min-height: 60px; }

    .modal-actions {
      display: flex;
      gap: 8px;
      margin-top: 16px;
      justify-content: flex-end;
    }

    .modal-actions button {
      font-family: inherit;
      font-size: 12px;
      padding: 6px 16px;
      border-radius: 4px;
      cursor: pointer;
      border: 1px solid var(--border);
    }

    .btn-primary {
      background: var(--border-bright);
      color: #fff;
      border-color: var(--accent) !important;
    }

    .btn-secondary {
      background: var(--surface2);
      color: var(--text-dim);
    }

    .connection-status {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 4px;
    }

    .connection-status.connected { background: var(--status-running); }
    .connection-status.disconnected { background: var(--status-error); }

    @media (max-width: 1100px) {
      .agents-panel { width: 200px; min-width: 200px; }
    }

    @media (max-width: 900px) {
      .main-layout { flex-direction: column; }
      .agents-panel { width: 100%; min-width: 100%; max-height: 200px; border-left: none; border-top: 1px solid var(--border); }
      .board-header, .swim-lane-body { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 500px) {
      .board-header, .swim-lane-body { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Agent Monitor — Kanban</h1>
    <div class="meta">
      <span class="connection-status disconnected" id="sse-status"></span>
      <span id="agent-count">{{.AgentCount}} agents</span>
      · v{{.Version}}
    </div>
  </header>

  <div class="toolbar">
    <button onclick="openCreateModal()">+ New Task</button>
    <select id="group-filter" onchange="filterByGroup(this.value)">
      <option value="">All Groups</option>
      {{range .Groups}}
      <option value="{{.}}">{{.}}</option>
      {{end}}
    </select>
  </div>

  <div class="main-layout">
  <div class="board">
    <div class="board-header">
      <div class="board-header-col" data-column="backlog">Backlog</div>
      <div class="board-header-col" data-column="active">Active</div>
      <div class="board-header-col" data-column="needs_input">Needs Input</div>
      <div class="board-header-col" data-column="done">Done</div>
    </div>
    <div id="swim-lanes"></div>
  </div>

  <div class="agents-panel">
    <div class="agents-panel-header">
      <span>Agents</span>
      <span class="column-count" id="agent-panel-count">0</span>
    </div>
    <div class="agents-list" id="agents-list"></div>
  </div>
  </div>

  <!-- Create Task Modal -->
  <div class="modal-overlay" id="create-modal">
    <div class="modal">
      <h2>New Task</h2>
      <label>Title</label>
      <input type="text" id="new-title" placeholder="Task title" autofocus>
      <label>Description</label>
      <textarea id="new-description" placeholder="Optional description"></textarea>
      <label>Session Name</label>
      <input type="text" id="new-session" placeholder="Link to tmux session (optional)">
      <label>Group</label>
      <select id="new-group">
        <option value="">None</option>
        {{range .Groups}}
        <option value="{{.}}">{{.}}</option>
        {{end}}
      </select>
      <div class="modal-actions">
        <button class="btn-secondary" onclick="closeCreateModal()">Cancel</button>
        <button class="btn-primary" onclick="createTask()">Create</button>
      </div>
    </div>
  </div>

  <script>
    // State
    let tasks = {};
    let agents = {};
    let currentGroupFilter = '';
    const columns = ['backlog', 'active', 'needs_input', 'done'];

    // Badge class lookup
    function badgeClass(badge) {
      const map = { cc: 'badge-cc', oc: 'badge-oc', cr: 'badge-cr', cx: 'badge-cx' };
      return map[badge] || 'badge-unknown';
    }

    // Render a single card
    function renderCard(task) {
      const agent = agents[task.session_name] || {};
      const badge = agent.badge || '';
      const status = agent.status || 'unknown';
      const lastLine = agent.last_line || '';

      let html = '<div class="card" id="task-' + task.id + '" data-group="' + (task.group || '') + '">';
      html += '<div class="card-header">';
      if (badge) {
        html += '<span class="badge ' + badgeClass(badge) + '">' + badge + '</span>';
      }
      if (task.session_name && agent.status) {
        html += '<span class="status-dot status-' + status + '"></span>';
      }
      html += '<span class="card-title">' + escapeHtml(task.title) + '</span>';
      html += '</div>';

      if (task.session_name) {
        html += '<div class="card-meta"><span class="card-session">' + escapeHtml(task.session_name) + '</span></div>';
      }

      if (task.description) {
        html += '<div class="card-description">' + escapeHtml(task.description) + '</div>';
      }

      if (lastLine) {
        html += '<div class="card-activity">' + escapeHtml(lastLine) + '</div>';
      }

      // Action buttons
      html += '<div class="card-actions">';
      columns.forEach(col => {
        if (col !== task.column) {
          const label = { backlog: '← Backlog', active: '● Active', needs_input: '◐ Input', done: '✓ Done' }[col];
          html += '<button onclick="moveTask(' + task.id + ',\'' + col + '\')">' + label + '</button>';
        }
      });
      if (task.column === 'backlog') {
        html += '<button onclick="launchTask(' + task.id + ',\'' + escapeHtml(task.title) + '\')" style="color:var(--status-running)">▶ Launch</button>';
      }
      html += '<button onclick="deleteTask(' + task.id + ')" style="color:var(--status-error)">✕</button>';
      html += '</div>';

      html += '</div>';
      return html;
    }

    // Render agents panel
    function renderAgentsPanel() {
      const list = document.getElementById('agents-list');
      const activeAgents = Object.values(agents)
        .filter(a => a.presence === 'active')
        .sort((a, b) => a.name.localeCompare(b.name));

      document.getElementById('agent-panel-count').textContent = activeAgents.length;

      if (activeAgents.length === 0) {
        list.innerHTML = '<div style="padding:12px;color:var(--text-dim);font-size:11px">No active agents</div>';
        return;
      }

      // Group agents by their group (from the /api/groups data if available)
      let html = '';
      activeAgents.forEach(a => {
        const statusClass = 'status-' + (a.status || 'unknown');
        html += '<div class="agent-item">';
        html += '<span class="status-dot ' + statusClass + '"></span>';
        if (a.badge) {
          html += '<span class="badge ' + badgeClass(a.badge) + '">' + a.badge + '</span>';
        }
        html += '<span class="agent-name">' + escapeHtml(a.name) + '</span>';
        html += '</div>';
        if (a.last_line) {
          html += '<div class="agent-activity">' + escapeHtml(a.last_line) + '</div>';
        }
      });

      list.innerHTML = html;
    }

    // Get collapsed lanes from localStorage
    function getCollapsedLanes() {
      try { return JSON.parse(localStorage.getItem('collapsed-lanes') || '{}'); }
      catch { return {}; }
    }

    function toggleLane(project) {
      const collapsed = getCollapsedLanes();
      collapsed[project] = !collapsed[project];
      localStorage.setItem('collapsed-lanes', JSON.stringify(collapsed));
      renderBoard();
    }

    // Re-render board with swim lanes
    function renderBoard() {
      const container = document.getElementById('swim-lanes');
      const collapsed = getCollapsedLanes();

      // Group tasks by project
      const byProject = {};
      const taskList = Object.values(tasks).sort((a, b) =>
        new Date(b.updated_at) - new Date(a.updated_at)
      );

      taskList.forEach(task => {
        if (task.column === 'archived') return;
        if (currentGroupFilter && task.group !== currentGroupFilter) return;
        const project = task.group || 'Ungrouped';
        if (!byProject[project]) byProject[project] = [];
        byProject[project].push(task);
      });

      // Sort projects alphabetically, but "Ungrouped" last
      const projects = Object.keys(byProject).sort((a, b) => {
        if (a === 'Ungrouped') return 1;
        if (b === 'Ungrouped') return -1;
        return a.localeCompare(b);
      });

      let html = '';
      projects.forEach(project => {
        const projectTasks = byProject[project];
        const isCollapsed = collapsed[project];
        const taskCount = projectTasks.length;

        html += '<div class="swim-lane' + (isCollapsed ? ' collapsed' : '') + '">';
        html += '<div class="swim-lane-header" onclick="toggleLane(\'' + escapeHtml(project) + '\')">';
        html += '<span class="collapse-icon">▼</span>';
        html += '<span class="swim-lane-name">' + escapeHtml(project) + '</span>';
        html += '<span class="swim-lane-count">' + taskCount + '</span>';
        html += '</div>';
        html += '<div class="swim-lane-body">';

        columns.forEach(col => {
          html += '<div class="swim-col">';
          projectTasks.forEach(task => {
            if (task.column === col) {
              html += renderCard(task);
            }
          });
          html += '</div>';
        });

        html += '</div></div>';
      });

      if (projects.length === 0) {
        html = '<div style="padding:20px;color:var(--text-dim);font-size:13px;text-align:center">No tasks yet. Create one or wait for Nous sync.</div>';
      }

      container.innerHTML = html;
    }

    // SSE connection
    function connectSSE() {
      const source = new EventSource('/api/events');
      const statusEl = document.getElementById('sse-status');

      source.onopen = () => {
        statusEl.className = 'connection-status connected';
      };

      source.onerror = () => {
        statusEl.className = 'connection-status disconnected';
      };

      source.addEventListener('agents:snapshot', (e) => {
        const list = JSON.parse(e.data);
        agents = {};
        list.forEach(a => { if (a.session) agents[a.session] = a; });
        document.getElementById('agent-count').textContent = list.filter(a => a.presence === 'active').length + ' agents';
        renderBoard();
        renderAgentsPanel();
      });

      source.addEventListener('agent:update', (e) => {
        const a = JSON.parse(e.data);
        if (a.session) agents[a.session] = a;
        renderBoard();
        renderAgentsPanel();
      });

      source.addEventListener('agent:added', (e) => {
        const a = JSON.parse(e.data);
        if (a.session) agents[a.session] = a;
        renderBoard();
        renderAgentsPanel();
      });

      source.addEventListener('agent:removed', (e) => {
        const a = JSON.parse(e.data);
        if (a.session) delete agents[a.session];
        renderBoard();
        renderAgentsPanel();
      });

      source.addEventListener('task:created', (e) => {
        const task = JSON.parse(e.data);
        tasks[task.id] = task;
        renderBoard();
      });

      source.addEventListener('task:updated', (e) => {
        const task = JSON.parse(e.data);
        tasks[task.id] = task;
        renderBoard();
      });

      source.addEventListener('task:deleted', (e) => {
        const data = JSON.parse(e.data);
        delete tasks[data.id];
        renderBoard();
      });
    }

    // Load initial tasks
    async function loadTasks() {
      const resp = await fetch('/api/tasks');
      const list = await resp.json();
      tasks = {};
      list.forEach(t => { tasks[t.id] = t; });
      renderBoard();
    }

    // API actions
    async function createTask() {
      const title = document.getElementById('new-title').value.trim();
      if (!title) return;

      const body = {
        title: title,
        description: document.getElementById('new-description').value.trim(),
        session_name: document.getElementById('new-session').value.trim(),
        group: document.getElementById('new-group').value,
      };

      await fetch('/api/tasks', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });

      closeCreateModal();
    }

    async function moveTask(id, column) {
      await fetch('/api/tasks/' + id, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ column: column }),
      });
    }

    async function deleteTask(id) {
      await fetch('/api/tasks/' + id, { method: 'DELETE' });
    }

    let availableProjects = [];
    async function loadProjects() {
      const resp = await fetch('/api/projects');
      availableProjects = await resp.json();
    }

    async function launchTask(taskId, taskTitle) {
      if (availableProjects.length === 0) {
        alert('No projects configured in projects.yaml');
        return;
      }
      const names = availableProjects.map(p => p.name);
      const choice = prompt('Launch project:\\n' + names.join(', ') + '\\n\\nEnter project name:');
      if (!choice || !names.includes(choice)) return;

      const resp = await fetch('/api/launch', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ project: choice, task_id: taskId, task: taskTitle }),
      });
      if (!resp.ok) {
        alert('Launch failed: ' + await resp.text());
      }
    }

    // UI helpers
    function openCreateModal() {
      document.getElementById('new-title').value = '';
      document.getElementById('new-description').value = '';
      document.getElementById('new-session').value = '';
      document.getElementById('new-group').value = '';
      document.getElementById('create-modal').classList.add('active');
      document.getElementById('new-title').focus();
    }

    function closeCreateModal() {
      document.getElementById('create-modal').classList.remove('active');
    }

    function filterByGroup(group) {
      currentGroupFilter = group;
      renderBoard();
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeCreateModal();
      if (e.key === 'n' && !e.ctrlKey && !e.metaKey && document.activeElement === document.body) {
        e.preventDefault();
        openCreateModal();
      }
    });

    // Init
    loadTasks();
    loadProjects();
    connectSSE();
  </script>
</body>
</html>
